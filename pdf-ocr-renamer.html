<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF表紙OCR リネームツール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Noto+Sans+JP:wght@300..700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs" type="module"></script>
<style>
/* Art direction: PDF管理ツール → functional/precise
   Palette: warm neutral, teal accent
   Typography: Inter (body) + Noto Sans JP (Japanese)
   Density: balanced */

:root, [data-theme="light"] {
  --color-bg: #f7f6f2;
  --color-surface: #f9f8f5;
  --color-surface-2: #fbfbf9;
  --color-surface-offset: #f3f0ec;
  --color-surface-offset-2: #edeae5;
  --color-surface-dynamic: #e6e4df;
  --color-divider: #dcd9d5;
  --color-border: #d4d1ca;
  --color-text: #28251d;
  --color-text-muted: #7a7974;
  --color-text-faint: #bab9b4;
  --color-text-inverse: #f9f8f4;
  --color-primary: #01696f;
  --color-primary-hover: #0c4e54;
  --color-primary-active: #0f3638;
  --color-primary-highlight: #cedcd8;
  --color-warning: #964219;
  --color-error: #a12c7b;
  --color-success: #437a22;
  --color-success-highlight: #d4dfcc;
  --color-orange: #da7101;
  --radius-sm: 0.375rem;
  --radius-md: 0.5rem;
  --radius-lg: 0.75rem;
  --radius-xl: 1rem;
  --radius-full: 9999px;
  --transition-interactive: 180ms cubic-bezier(0.16, 1, 0.3, 1);
  --shadow-sm: 0 1px 2px oklch(0.2 0.01 80 / 0.06);
  --shadow-md: 0 4px 12px oklch(0.2 0.01 80 / 0.08);
  --shadow-lg: 0 12px 32px oklch(0.2 0.01 80 / 0.12);
  --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
  --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
  --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
  --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
  --text-xl: clamp(1.5rem, 1.2rem + 1.25vw, 2.25rem);
  --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem;
  --space-4: 1rem; --space-5: 1.25rem; --space-6: 1.5rem;
  --space-8: 2rem; --space-10: 2.5rem; --space-12: 3rem;
  --space-16: 4rem; --space-20: 5rem;
  --font-body: 'Inter', 'Noto Sans JP', sans-serif;
  --content-default: 1100px;
}

[data-theme="dark"] {
  --color-bg: #171614;
  --color-surface: #1c1b19;
  --color-surface-2: #201f1d;
  --color-surface-offset: #1d1c1a;
  --color-surface-offset-2: #22211f;
  --color-surface-dynamic: #2d2c2a;
  --color-divider: #262523;
  --color-border: #393836;
  --color-text: #cdccca;
  --color-text-muted: #797876;
  --color-text-faint: #5a5957;
  --color-text-inverse: #2b2a28;
  --color-primary: #4f98a3;
  --color-primary-hover: #227f8b;
  --color-primary-active: #1a626b;
  --color-primary-highlight: #313b3b;
  --color-warning: #bb653b;
  --color-error: #d163a7;
  --color-success: #6daa45;
  --color-success-highlight: #3a4435;
  --color-orange: #fdab43;
  --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.2);
  --shadow-md: 0 4px 12px oklch(0 0 0 / 0.3);
  --shadow-lg: 0 12px 32px oklch(0 0 0 / 0.4);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --color-bg: #171614; --color-surface: #1c1b19; --color-surface-2: #201f1d;
    --color-surface-offset: #1d1c1a; --color-surface-offset-2: #22211f;
    --color-surface-dynamic: #2d2c2a; --color-divider: #262523; --color-border: #393836;
    --color-text: #cdccca; --color-text-muted: #797876; --color-text-faint: #5a5957;
    --color-text-inverse: #2b2a28; --color-primary: #4f98a3;
    --color-primary-hover: #227f8b; --color-primary-active: #1a626b;
    --color-primary-highlight: #313b3b; --color-warning: #bb653b;
    --color-error: #d163a7; --color-success: #6daa45; --color-success-highlight: #3a4435;
    --color-orange: #fdab43;
  }
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-font-smoothing: antialiased; scroll-behavior: smooth; scroll-padding-top: var(--space-16); }
body { min-height: 100dvh; font-family: var(--font-body); font-size: var(--text-base); color: var(--color-text); background-color: var(--color-bg); }
img, picture, canvas, svg { display: block; max-width: 100%; height: auto; }
input, button, textarea, select { font: inherit; color: inherit; }
h1,h2,h3,h4 { text-wrap: balance; line-height: 1.2; }
p, li { text-wrap: pretty; }
button { cursor: pointer; background: none; border: none; }
a, button, [role="button"], input, textarea, select { transition: color var(--transition-interactive), background var(--transition-interactive), border-color var(--transition-interactive), box-shadow var(--transition-interactive); }
:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 3px; border-radius: var(--radius-sm); }

/* Layout */
.app { display: flex; flex-direction: column; min-height: 100dvh; }

header {
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--space-3) var(--space-6);
  background: var(--color-surface);
  border-bottom: 1px solid oklch(from var(--color-text) l c h / 0.1);
  position: sticky; top: 0; z-index: 100;
  box-shadow: var(--shadow-sm);
}

.logo { display: flex; align-items: center; gap: var(--space-3); }
.logo svg { color: var(--color-primary); }
.logo-text { font-size: var(--text-sm); font-weight: 700; color: var(--color-text); letter-spacing: -0.01em; }
.logo-sub { font-size: var(--text-xs); color: var(--color-text-muted); font-weight: 400; }

.header-actions { display: flex; align-items: center; gap: var(--space-3); }

.theme-toggle {
  display: flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; border-radius: var(--radius-full);
  color: var(--color-text-muted);
  border: 1px solid oklch(from var(--color-text) l c h / 0.12);
}
.theme-toggle:hover { background: var(--color-surface-offset); color: var(--color-text); }

main { flex: 1; max-width: var(--content-default); margin: 0 auto; padding: var(--space-8) var(--space-6); width: 100%; }

/* Step indicators */
.steps { display: flex; gap: var(--space-2); margin-bottom: var(--space-8); }
.step {
  display: flex; align-items: center; gap: var(--space-2);
  padding: var(--space-2) var(--space-4); border-radius: var(--radius-full);
  font-size: var(--text-xs); font-weight: 600; color: var(--color-text-muted);
  background: var(--color-surface-offset); border: 1px solid var(--color-border);
  transition: all var(--transition-interactive);
}
.step.active { background: var(--color-primary-highlight); color: var(--color-primary); border-color: var(--color-primary); }
.step.done { background: var(--color-success-highlight); color: var(--color-success); border-color: var(--color-success); }
.step-num { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; background: currentColor; }
.step-num span { color: white; }
.step.done .step-num span { color: white; }

/* Drop Zone */
.drop-zone {
  border: 2px dashed var(--color-border); border-radius: var(--radius-xl);
  padding: var(--space-16) var(--space-8); text-align: center;
  background: var(--color-surface); cursor: pointer;
  transition: all var(--transition-interactive);
  position: relative;
}
.drop-zone:hover, .drop-zone.dragover {
  border-color: var(--color-primary); background: var(--color-primary-highlight);
}
.drop-zone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.drop-icon { width: 48px; height: 48px; margin: 0 auto var(--space-4); color: var(--color-text-faint); }
.drop-zone h2 { font-size: var(--text-lg); margin-bottom: var(--space-2); }
.drop-zone p { color: var(--color-text-muted); font-size: var(--text-sm); }
.drop-hint { margin-top: var(--space-4); font-size: var(--text-xs); color: var(--color-text-faint); }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: var(--space-2);
  padding: var(--space-2) var(--space-5); border-radius: var(--radius-md);
  font-size: var(--text-sm); font-weight: 600; line-height: 1.4;
  cursor: pointer; border: 1px solid transparent;
}
.btn-primary { background: var(--color-primary); color: white; }
.btn-primary:hover { background: var(--color-primary-hover); }
.btn-primary:active { background: var(--color-primary-active); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-secondary { background: var(--color-surface-offset); color: var(--color-text); border-color: var(--color-border); }
.btn-secondary:hover { background: var(--color-surface-dynamic); }
.btn-danger { background: transparent; color: var(--color-error); border-color: var(--color-error); }
.btn-danger:hover { background: color-mix(in oklch, var(--color-error) 10%, transparent); }
.btn-success { background: var(--color-success); color: white; }
.btn-success:hover { background: color-mix(in oklch, var(--color-success) 80%, black); }
.btn-sm { padding: var(--space-1) var(--space-3); font-size: var(--text-xs); }

/* Toolbar */
.toolbar { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-5); flex-wrap: wrap; }
.toolbar-left { display: flex; align-items: center; gap: var(--space-3); flex: 1; }
.toolbar-right { display: flex; align-items: center; gap: var(--space-3); }
.file-count { font-size: var(--text-sm); color: var(--color-text-muted); }

/* OCR Engine selector */
.engine-selector { display: flex; align-items: center; gap: var(--space-2); }
.engine-selector label { font-size: var(--text-xs); color: var(--color-text-muted); }
.engine-selector select {
  font-size: var(--text-xs); padding: var(--space-1) var(--space-3);
  border: 1px solid var(--color-border); border-radius: var(--radius-md);
  background: var(--color-surface-2); color: var(--color-text);
}

/* Progress bar */
.progress-bar-wrap { margin-bottom: var(--space-5); }
.progress-bar-label { display: flex; justify-content: space-between; margin-bottom: var(--space-2); font-size: var(--text-xs); color: var(--color-text-muted); }
.progress-bar-track { height: 6px; background: var(--color-surface-dynamic); border-radius: var(--radius-full); overflow: hidden; }
.progress-bar-fill { height: 100%; background: var(--color-primary); border-radius: var(--radius-full); transition: width 0.3s ease; width: 0; }

/* PDF Cards Grid */
.cards-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(min(340px, 100%), 1fr));
  gap: var(--space-5);
}

.pdf-card {
  background: var(--color-surface); border: 1px solid var(--color-border);
  border-radius: var(--radius-lg); padding: var(--space-4);
  box-shadow: var(--shadow-sm); transition: box-shadow var(--transition-interactive);
  display: flex; flex-direction: column; gap: var(--space-3);
}
.pdf-card:hover { box-shadow: var(--shadow-md); }
.pdf-card.processing { opacity: 0.7; }
.pdf-card.done { border-color: var(--color-success); }
.pdf-card.renamed { background: var(--color-success-highlight); border-color: var(--color-success); }

.card-header { display: flex; align-items: flex-start; gap: var(--space-3); }
.card-thumb {
  width: 64px; min-width: 64px; height: 88px;
  border-radius: var(--radius-sm); overflow: hidden;
  background: var(--color-surface-offset); border: 1px solid var(--color-border);
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
.card-thumb canvas { width: 100%; height: 100%; object-fit: cover; }
.card-thumb .thumb-placeholder { color: var(--color-text-faint); }
.card-thumb .processing-overlay {
  position: absolute; inset: 0; background: oklch(from var(--color-surface) l c h / 0.85);
  display: flex; align-items: center; justify-content: center; border-radius: var(--radius-sm);
}
.spinner {
  width: 20px; height: 20px; border: 2px solid var(--color-border);
  border-top-color: var(--color-primary); border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.card-meta { flex: 1; min-width: 0; }
.card-filename {
  font-size: var(--text-xs); color: var(--color-text-muted);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  margin-bottom: var(--space-1);
}
.card-status { display: inline-flex; align-items: center; gap: var(--space-1); font-size: var(--text-xs); }
.status-dot { width: 6px; height: 6px; border-radius: 50%; }
.status-dot.pending { background: var(--color-text-faint); }
.status-dot.processing { background: var(--color-orange); }
.status-dot.done { background: var(--color-success); }
.status-dot.error { background: var(--color-error); }

/* Editable fields */
.field-group { display: flex; flex-direction: column; gap: var(--space-1); }
.field-label {
  font-size: var(--text-xs); color: var(--color-text-muted); font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.04em;
}
.field-input {
  width: 100%; padding: var(--space-2) var(--space-3);
  border: 1px solid var(--color-border); border-radius: var(--radius-md);
  background: var(--color-surface-2); color: var(--color-text);
  font-size: var(--text-sm); line-height: 1.4;
  transition: border-color var(--transition-interactive), box-shadow var(--transition-interactive);
  resize: none;
}
.field-input:focus { outline: none; border-color: var(--color-primary); box-shadow: 0 0 0 3px oklch(from var(--color-primary) l c h / 0.15); }
.field-input.auto-filled { background: color-mix(in oklch, var(--color-primary-highlight) 40%, var(--color-surface-2)); }

.card-preview-name { font-size: var(--text-xs); color: var(--color-text-muted); margin-top: var(--space-1); word-break: break-all; }
.card-preview-name strong { color: var(--color-primary); }

.card-actions { display: flex; gap: var(--space-2); }

/* Batch output area */
.output-section { margin-top: var(--space-8); }
.output-section h3 { font-size: var(--text-lg); margin-bottom: var(--space-4); }
.output-tabs { display: flex; border-bottom: 1px solid var(--color-border); margin-bottom: var(--space-4); }
.output-tab {
  padding: var(--space-2) var(--space-4); font-size: var(--text-sm); font-weight: 500;
  color: var(--color-text-muted); border-bottom: 2px solid transparent; margin-bottom: -1px;
  cursor: pointer; background: none; border-left: none; border-right: none; border-top: none;
}
.output-tab.active { color: var(--color-primary); border-bottom-color: var(--color-primary); }
.output-tab:hover { color: var(--color-text); }

.output-textarea {
  width: 100%; height: 280px; padding: var(--space-4);
  border: 1px solid var(--color-border); border-radius: var(--radius-lg);
  background: var(--color-surface); color: var(--color-text);
  font-family: 'Menlo', 'Monaco', 'Consolas', monospace; font-size: var(--text-xs);
  line-height: 1.6; resize: vertical;
}
.output-textarea:focus { outline: none; border-color: var(--color-primary); }

.output-actions { display: flex; gap: var(--space-3); margin-top: var(--space-4); flex-wrap: wrap; align-items: center; }
.output-hint { font-size: var(--text-xs); color: var(--color-text-muted); flex: 1; }

/* Toast */
.toast-container { position: fixed; bottom: var(--space-6); right: var(--space-6); display: flex; flex-direction: column; gap: var(--space-3); z-index: 9999; }
.toast {
  padding: var(--space-3) var(--space-4); border-radius: var(--radius-md);
  background: var(--color-surface); border: 1px solid var(--color-border);
  box-shadow: var(--shadow-lg); font-size: var(--text-sm);
  display: flex; align-items: center; gap: var(--space-3); max-width: 360px;
  animation: toast-in 0.3s cubic-bezier(0.16,1,0.3,1);
}
.toast.success { border-color: var(--color-success); }
.toast.error { border-color: var(--color-error); }
@keyframes toast-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

/* Section heading */
.section-heading { display: flex; align-items: baseline; gap: var(--space-3); margin-bottom: var(--space-5); }
.section-heading h2 { font-size: var(--text-xl); font-weight: 700; }
.section-heading p { font-size: var(--text-sm); color: var(--color-text-muted); }

/* Empty state */
.empty-state { padding: var(--space-16) var(--space-8); text-align: center; color: var(--color-text-muted); }
.empty-state svg { margin: 0 auto var(--space-4); color: var(--color-text-faint); }
.empty-state h3 { color: var(--color-text); margin-bottom: var(--space-2); font-size: var(--text-lg); }
.empty-state p { max-width: 36ch; margin: 0 auto; font-size: var(--text-sm); }

/* OCR raw text toggle */
.raw-toggle { font-size: var(--text-xs); color: var(--color-primary); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; background: none; border: none; padding: 0; }
.raw-text-box { margin-top: var(--space-2); padding: var(--space-2) var(--space-3); background: var(--color-surface-offset); border-radius: var(--radius-sm); font-family: monospace; font-size: 11px; color: var(--color-text-muted); max-height: 80px; overflow-y: auto; line-height: 1.5; white-space: pre-wrap; word-break: break-all; display: none; }
.raw-text-box.open { display: block; }

/* Badge */
.badge {
  display: inline-flex; align-items: center; padding: 2px var(--space-2);
  border-radius: var(--radius-full); font-size: 11px; font-weight: 600;
  background: var(--color-surface-offset); color: var(--color-text-muted);
}
.badge.green { background: var(--color-success-highlight); color: var(--color-success); }

/* Renamed chip */
.renamed-chip {
  display: inline-flex; align-items: center; gap: var(--space-1);
  padding: 2px var(--space-2); background: var(--color-success-highlight);
  color: var(--color-success); border-radius: var(--radius-full); font-size: 11px; font-weight: 600;
}

@media (max-width: 640px) {
  main { padding: var(--space-5) var(--space-4); }
  .cards-grid { grid-template-columns: 1fr; }
  .steps { flex-wrap: wrap; }
}
</style>
</head>
<body>
<div class="app">

<!-- HEADER -->
<header>
  <div class="logo">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-label="PDF OCR Tool logo">
      <rect x="4" y="2" width="14" height="18" rx="2" stroke="currentColor" stroke-width="1.8" fill="none"/>
      <rect x="10" y="8" width="14" height="18" rx="2" stroke="currentColor" stroke-width="1.8" fill="none" stroke-dasharray="3 2"/>
      <path d="M8 8h6M8 11h8M8 14h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <div>
      <div class="logo-text">PDF OCR Renamer</div>
      <div class="logo-sub">表紙OCR → 著者・タイトル抽出 → 一括リネーム</div>
    </div>
  </div>
  <div class="header-actions">
    <button class="theme-toggle" data-theme-toggle aria-label="ダークモード切替">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
    </button>
  </div>
</header>

<main>
  <!-- Steps -->
  <div class="steps" id="steps">
    <div class="step active" id="step1">
      <div class="step-num"><span>1</span></div>
      PDFを読み込む
    </div>
    <div class="step" id="step2">
      <div class="step-num"><span>2</span></div>
      OCR実行・確認
    </div>
    <div class="step" id="step3">
      <div class="step-num"><span>3</span></div>
      テキスト出力・リネーム
    </div>
  </div>

  <!-- Drop Zone (shown initially) -->
  <div id="dropZoneSection">
    <div class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" accept=".pdf" multiple>
      <svg class="drop-icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="8" y="4" width="24" height="32" rx="3" stroke-width="2.5"/>
        <rect x="16" y="12" width="24" height="32" rx="3" fill="var(--color-surface)" stroke-width="2.5"/>
        <path d="M28 25v8M28 25l-3 3M28 25l3 3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h2>PDFファイルをドロップ</h2>
      <p>またはクリックしてファイルを選択</p>
      <div class="drop-hint">複数のPDFを一括読み込み可能（最初のページのみOCR）</div>
    </div>
  </div>

  <!-- Processing Section (hidden initially) -->
  <div id="processingSection" style="display:none">
    <div class="toolbar">
      <div class="toolbar-left">
        <span class="file-count" id="fileCount">0 件のPDF</span>
        <div class="engine-selector">
          <label for="engineSelect">OCRエンジン:</label>
          <select id="engineSelect">
            <option value="tesseract">Tesseract.js (ローカル)</option>
          </select>
        </div>
      </div>
      <div class="toolbar-right">
        <button class="btn btn-secondary btn-sm" id="addMoreBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
          追加
        </button>
        <input type="file" id="fileInputMore" accept=".pdf" multiple style="display:none">
        <button class="btn btn-primary btn-sm" id="runOcrBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          全件OCR実行
        </button>
      </div>
    </div>

    <div class="progress-bar-wrap" id="progressWrap" style="display:none">
      <div class="progress-bar-label">
        <span id="progressLabel">処理中…</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
    </div>

    <div class="cards-grid" id="cardsGrid"></div>
  </div>

  <!-- Output Section -->
  <div class="output-section" id="outputSection" style="display:none">
    <div class="section-heading">
      <h3>出力・リネーム</h3>
    </div>
    <div class="output-tabs">
      <button class="output-tab active" data-tab="list">📋 一覧テキスト</button>
      <button class="output-tab" data-tab="rename">📝 リネームスクリプト</button>
    </div>
    <div id="tabList">
      <textarea class="output-textarea" id="listOutput" readonly placeholder="OCR完了後に一覧が表示されます"></textarea>
    </div>
    <div id="tabRename" style="display:none">
      <div style="display:flex; gap: var(--space-3); margin-bottom: var(--space-3);">
        <button class="btn btn-secondary btn-sm" id="scriptTypeBtn" data-type="bash" onclick="toggleScriptType()">
          現在: Bash / クリックでPowerShellに切替
        </button>
      </div>
      <textarea class="output-textarea" id="renameOutput" readonly placeholder="OCR完了後にリネームスクリプトが生成されます"></textarea>
    </div>
    <div class="output-actions">
      <button class="btn btn-secondary btn-sm" id="copyListBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        コピー
      </button>
      <button class="btn btn-secondary btn-sm" id="downloadListBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        ダウンロード
      </button>
      <span class="output-hint" id="outputHint">OCR完了後に一覧・リネームスクリプトが生成されます</span>
      <button class="btn btn-primary" id="applyRenameBtn" style="display:none">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22C6.477 22 2 17.523 2 12S6.477 2 12 2s10 4.477 10 10-4.477 10-10 10zm-1-7l-3-3 1.414-1.414L11 12.172l4.586-4.586L17 9l-6 6z" fill="currentColor" stroke="none"/></svg>
        ブラウザ内リネーム適用（ダウンロード）
      </button>
    </div>
  </div>
</main>
</div>

<div class="toast-container" id="toastContainer"></div>

<script type="module">
// ===== State =====
const state = {
  files: [],      // { file, id, filename, status, thumb, author, title, rawText, renamed }
  processing: false,
  scriptType: 'bash',
};

// ===== DOM refs =====
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const fileInputMore = document.getElementById('fileInputMore');
const cardsGrid = document.getElementById('cardsGrid');
const runOcrBtn = document.getElementById('runOcrBtn');
const fileCount = document.getElementById('fileCount');
const progressWrap = document.getElementById('progressWrap');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');
const progressPct = document.getElementById('progressPct');
const dropZoneSection = document.getElementById('dropZoneSection');
const processingSection = document.getElementById('processingSection');
const outputSection = document.getElementById('outputSection');
const listOutput = document.getElementById('listOutput');
const renameOutput = document.getElementById('renameOutput');
const applyRenameBtn = document.getElementById('applyRenameBtn');
const outputHint = document.getElementById('outputHint');

// ===== Theme Toggle =====
(function(){
  const t=document.querySelector('[data-theme-toggle]'),r=document.documentElement;
  let d=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
  r.setAttribute('data-theme',d);
  t&&t.addEventListener('click',()=>{
    d=d==='dark'?'light':'dark';
    r.setAttribute('data-theme',d);
    t.innerHTML=d==='dark'
      ?'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>'
      :'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
  });
})();

// ===== PDF.js setup =====
let pdfjsLib = null;
async function getPdfJs() {
  if (pdfjsLib) return pdfjsLib;
  const mod = await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs');
  mod.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.min.mjs';
  pdfjsLib = mod;
  return mod;
}

// ===== Tesseract =====
let Tesseract = null;
async function getTesseract() {
  if (Tesseract) return Tesseract;
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload = () => { Tesseract = window.Tesseract; resolve(Tesseract); };
    s.onerror = reject;
    document.head.appendChild(s);
  });
}

// ===== File loading =====
function loadFiles(fileList) {
  const newFiles = Array.from(fileList).filter(f => f.name.endsWith('.pdf'));
  if (!newFiles.length) { showToast('PDFファイルを選択してください', 'error'); return; }

  newFiles.forEach(f => {
    if (state.files.find(x => x.filename === f.name)) return; // skip dups
    state.files.push({ file: f, id: Date.now() + Math.random(), filename: f.name,
      status: 'pending', thumb: null, author: '', title: '', rawText: '', renamed: false });
  });

  dropZoneSection.style.display = 'none';
  processingSection.style.display = 'block';
  outputSection.style.display = 'block';
  updateSteps(2);
  renderCards();
  updateFileCount();
  renderThumbs();
}

fileInput.addEventListener('change', e => loadFiles(e.target.files));
fileInputMore.addEventListener('change', e => loadFiles(e.target.files));
document.getElementById('addMoreBtn').addEventListener('click', () => fileInputMore.click());

dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('dragover'); loadFiles(e.dataTransfer.files); });

// ===== Render thumbnails with PDF.js =====
async function renderThumbs() {
  const lib = await getPdfJs();
  for (const item of state.files) {
    if (item.thumb) continue;
    try {
      const arrayBuf = await item.file.arrayBuffer();
      const pdf = await lib.getDocument({ data: arrayBuf }).promise;
      const page = await pdf.getPage(1);
      const viewport = page.getViewport({ scale: 0.5 });
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width; canvas.height = viewport.height;
      const ctx = canvas.getContext('2d');
      await page.render({ canvasContext: ctx, viewport }).promise;
      item.thumb = canvas;
      const thumbEl = document.getElementById('thumb-' + item.id);
      if (thumbEl) {
        thumbEl.innerHTML = '';
        canvas.style.width = '100%'; canvas.style.height = '100%'; canvas.style.objectFit = 'cover';
        thumbEl.appendChild(canvas);
      }
    } catch(e) { console.warn('thumb failed', item.filename, e); }
  }
}

// ===== Render cards =====
function renderCards() {
  cardsGrid.innerHTML = '';
  if (!state.files.length) {
    cardsGrid.innerHTML = '<div class="empty-state"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><h3>PDFが読み込まれていません</h3><p>上のエリアにPDFをドロップしてください</p></div>';
    return;
  }
  state.files.forEach(item => {
    cardsGrid.appendChild(createCard(item));
  });
}

function createCard(item) {
  const card = document.createElement('div');
  card.className = 'pdf-card' + (item.status === 'done' ? ' done' : '') + (item.renamed ? ' renamed' : '');
  card.id = 'card-' + item.id;

  const statusText = { pending: '待機中', processing: '処理中…', done: 'OCR完了', error: 'エラー' };
  const previewName = item.author || item.title
    ? sanitizeFilename((item.author ? item.author + '_' : '') + (item.title || 'NOTITLE')) + '_' + item.filename
    : item.filename;

  card.innerHTML = `
    <div class="card-header">
      <div class="card-thumb" id="thumb-${item.id}">
        ${item.thumb ? '' : '<svg class="thumb-placeholder" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>'}
        ${item.status === 'processing' ? '<div class="processing-overlay"><div class="spinner"></div></div>' : ''}
      </div>
      <div class="card-meta">
        <div class="card-filename" title="${item.filename}">${item.filename}</div>
        <div class="card-status">
          <div class="status-dot ${item.status}"></div>
          <span style="font-size:var(--text-xs); color:var(--color-text-muted)">${statusText[item.status] || item.status}</span>
          ${item.renamed ? '<span class="renamed-chip">✓ リネーム済み</span>' : ''}
        </div>
        ${item.rawText ? `<button class="raw-toggle" onclick="toggleRaw('${item.id}')">OCR生テキスト表示</button><div class="raw-text-box" id="raw-${item.id}">${escHtml(item.rawText.substring(0, 500))}${item.rawText.length > 500 ? '…' : ''}</div>` : ''}
      </div>
    </div>
    <div class="field-group">
      <label class="field-label">筆頭著者</label>
      <input class="field-input ${item.author ? 'auto-filled' : ''}" type="text" id="author-${item.id}" value="${escHtml(item.author)}" placeholder="例: 山田 太郎 / Smith, J." oninput="onFieldChange('${item.id}', 'author', this.value)">
    </div>
    <div class="field-group">
      <label class="field-label">タイトル</label>
      <textarea class="field-input ${item.title ? 'auto-filled' : ''}" id="title-${item.id}" rows="2" placeholder="例: 海洋生態系の保全に関する研究" oninput="onFieldChange('${item.id}', 'title', this.value)">${escHtml(item.title)}</textarea>
    </div>
    <div class="card-preview-name" id="preview-${item.id}">
      新ファイル名: <strong>${escHtml(previewName)}</strong>
    </div>
    <div class="card-actions">
      <button class="btn btn-primary btn-sm" onclick="singleOcr('${item.id}')">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        OCR
      </button>
      <button class="btn btn-success btn-sm" onclick="singleRename('${item.id}')">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        ダウンロード
      </button>
      <button class="btn btn-danger btn-sm" onclick="removeFile('${item.id}')">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
      </button>
    </div>
  `;
  if (item.thumb) {
    const thumbEl = card.querySelector('.card-thumb');
    item.thumb.style.width = '100%'; item.thumb.style.height = '100%'; item.thumb.style.objectFit = 'cover';
    thumbEl.innerHTML = '';
    thumbEl.appendChild(item.thumb);
  }
  return card;
}

function updateCard(item) {
  const old = document.getElementById('card-' + item.id);
  if (old) old.replaceWith(createCard(item));
}

window.toggleRaw = (id) => {
  const el = document.getElementById('raw-' + id);
  if (el) el.classList.toggle('open');
};
window.onFieldChange = (id, field, value) => {
  const item = state.files.find(f => f.id == id);
  if (!item) return;
  item[field] = value;
  const prevEl = document.getElementById('preview-' + id);
  if (prevEl) {
    const name = buildNewName(item);
    prevEl.innerHTML = '新ファイル名: <strong>' + escHtml(name) + '</strong>';
  }
  updateOutputs();
};
window.removeFile = (id) => {
  state.files = state.files.filter(f => f.id != id);
  updateFileCount();
  renderCards();
  updateOutputs();
  if (!state.files.length) {
    processingSection.style.display = 'none';
    outputSection.style.display = 'none';
    dropZoneSection.style.display = 'block';
    updateSteps(1);
  }
};

// ===== OCR =====
async function runOcr(item) {
  item.status = 'processing';
  updateCard(item);
  try {
    // Render PDF page 1 to canvas
    const lib = await getPdfJs();
    const arrayBuf = await item.file.arrayBuffer();
    const pdf = await lib.getDocument({ data: new Uint8Array(arrayBuf) }).promise;
    const page = await pdf.getPage(1);
    const viewport = page.getViewport({ scale: 2.5 });
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width; canvas.height = viewport.height;
    const ctx = canvas.getContext('2d');
    await page.render({ canvasContext: ctx, viewport }).promise;

    // Run Tesseract on the canvas
    const Tes = await getTesseract();
    const worker = await Tes.createWorker(['jpn', 'eng'], 1, {
      workerPath: 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/worker.min.js',
      langPath: 'https://tessdata.projectnaptha.com/4.0.0',
      corePath: 'https://cdn.jsdelivr.net/npm/tesseract.js-core@5/tesseract-core-simd-lstm.wasm.js',
    });
    const result = await worker.recognize(canvas);
    await worker.terminate();

    const rawText = result.data.text || '';
    item.rawText = rawText;
    const extracted = extractInfo(rawText);
    item.author = extracted.author;
    item.title = extracted.title;
    item.status = 'done';
  } catch(e) {
    console.error('OCR error', e);
    item.status = 'error';
    item.rawText = 'OCRエラー: ' + e.message;
  }
  updateCard(item);
  updateOutputs();
}

window.singleOcr = async (id) => {
  const item = state.files.find(f => f.id == id);
  if (!item) return;
  await runOcr(item);
};

runOcrBtn.addEventListener('click', async () => {
  if (state.processing) return;
  state.processing = true;
  runOcrBtn.disabled = true;
  progressWrap.style.display = 'block';
  const total = state.files.length;
  for (let i = 0; i < state.files.length; i++) {
    const item = state.files[i];
    progressLabel.textContent = `${item.filename} を処理中… (${i+1}/${total})`;
    const pct = Math.round((i / total) * 100);
    progressFill.style.width = pct + '%';
    progressPct.textContent = pct + '%';
    await runOcr(item);
  }
  progressFill.style.width = '100%';
  progressPct.textContent = '100%';
  progressLabel.textContent = `完了 (${total}件)`;
  state.processing = false;
  runOcrBtn.disabled = false;
  updateSteps(3);
  showToast('全件OCR完了しました ✓', 'success');
  applyRenameBtn.style.display = 'inline-flex';
  setTimeout(() => { progressWrap.style.display = 'none'; }, 3000);
});

// ===== Extract author + title from OCR text =====
function extractInfo(text) {
  const lines = text.split(/\n|\r|\r\n/).map(l => l.trim()).filter(Boolean);

  // Heuristics for title: longest meaningful line near the top (first 1/3 of lines)
  const topLines = lines.slice(0, Math.max(3, Math.ceil(lines.length / 3)));

  // Title: prefer longer lines (>= 8 chars), exclude pure number/date lines
  const titleCandidates = topLines
    .filter(l => l.length >= 8 && !/^[\d\s\-\/年月日,.:]+$/.test(l))
    .sort((a, b) => b.length - a.length);
  const title = titleCandidates[0] ? titleCandidates[0].substring(0, 80) : '';

  // Author: look for patterns like "著者:", "Author:", "by ", Japanese names, or lines with commas/etal
  let author = '';
  const authorPatterns = [
    /著者[：:]\s*(.+)/i,
    /編著[：:]\s*(.+)/i,
    /Author[s]?[：:]\s*(.+)/i,
    /by\s+([A-Z][a-z]+(?:\s+[A-Z][a-z]+){0,3})/,
    /^([A-Z][a-z]+(?:,\s*[A-Z]\.?)+(?:\s+et\s+al\.?)?)/,
    /^([A-Z][a-z]+,\s+[A-Z][a-z]+)/,
    // Japanese name pattern (2-4 kanji chars)
    /^([一-鿿]{2,4}(?:\s+[一-鿿]{2,4})*)/,
  ];
  for (const line of lines) {
    for (const pat of authorPatterns) {
      const m = line.match(pat);
      if (m) { author = m[1].trim().substring(0, 40); break; }
    }
    if (author) break;
  }

  return { author, title };
}

// ===== Build new filename =====
function sanitizeFilename(str) {
  return str
    .replace(/[\\/:*?"<>|\n\r\t]/g, '_')
    .replace(/\.pdf$/i, '')
    .replace(/\s+/g, '_')
    .replace(/_+/g, '_')
    .replace(/^_|_$/g, '')
    .substring(0, 120);
}

function buildNewName(item) {
  if (!item.author && !item.title) return item.filename;
  const parts = [];
  if (item.author) parts.push(sanitizeFilename(item.author));
  if (item.title) parts.push(sanitizeFilename(item.title));
  return parts.join('_') + '.pdf';
}

// ===== Update output texts =====
function updateOutputs() {
  const lines = state.files.map((item, i) => {
    const newName = buildNewName(item);
    return [
      `[${String(i+1).padStart(3,'0')}] ${item.filename}`,
      `  著者  : ${item.author || '（未抽出）'}`,
      `  タイトル: ${item.title || '（未抽出）'}`,
      `  新ファイル名: ${newName}`,
      `  OCR状態: ${item.status}`,
      ''
    ].join('\n');
  });
  listOutput.value = '# PDF OCR 抽出結果一覧\n' + new Date().toLocaleString('ja-JP') + '\n\n' + lines.join('\n');

  // Rename scripts
  const state_type = document.getElementById('scriptTypeBtn')?.dataset.type || 'bash';
  generateRenameScript(state_type);

  outputHint.textContent = `${state.files.filter(f=>f.status==='done').length}/${state.files.length} 件OCR完了`;
}

function generateRenameScript(type) {
  const scriptTypeBtn = document.getElementById('scriptTypeBtn');
  if (!scriptTypeBtn) return;
  const isBash = type === 'bash';
  let script = '';
  if (isBash) {
    script = '#!/bin/bash\n# PDF一括リネームスクリプト（Bash）\n# OCR PDF Renamer で自動生成\n# 使用方法: chmod +x rename.sh && ./rename.sh\n\n';
    script += 'set -e\n\n';
    state.files.forEach(item => {
      const newName = buildNewName(item);
      if (newName !== item.filename) {
        script += `mv "${item.filename.replace(/"/g, '\\"')}" "${newName.replace(/"/g, '\\"')}"\n`;
      }
    });
  } else {
    script = '# PDF一括リネームスクリプト（PowerShell）\n# OCR PDF Renamer で自動生成\n# 使用方法: .\\rename.ps1\n\n';
    state.files.forEach(item => {
      const newName = buildNewName(item);
      if (newName !== item.filename) {
        script += `Rename-Item -Path "${item.filename.replace(/"/g, '`"')}" -NewName "${newName.replace(/"/g, '`"')}"\n`;
      }
    });
  }
  renameOutput.value = script;
}

window.toggleScriptType = () => {
  const btn = document.getElementById('scriptTypeBtn');
  const cur = btn.dataset.type;
  const next = cur === 'bash' ? 'powershell' : 'bash';
  btn.dataset.type = next;
  btn.textContent = next === 'bash'
    ? '現在: Bash / クリックでPowerShellに切替'
    : '現在: PowerShell / クリックでBashに切替';
  generateRenameScript(next);
};

// ===== Tabs =====
document.querySelectorAll('.output-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.output-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('tabList').style.display = tab.dataset.tab === 'list' ? 'block' : 'none';
    document.getElementById('tabRename').style.display = tab.dataset.tab === 'rename' ? 'block' : 'none';
  });
});

// ===== Copy & Download =====
document.getElementById('copyListBtn').addEventListener('click', () => {
  const activeTab = document.querySelector('.output-tab.active');
  const text = activeTab?.dataset.tab === 'rename' ? renameOutput.value : listOutput.value;
  navigator.clipboard.writeText(text).then(() => showToast('クリップボードにコピーしました', 'success'));
});

document.getElementById('downloadListBtn').addEventListener('click', () => {
  const activeTab = document.querySelector('.output-tab.active');
  const isRename = activeTab?.dataset.tab === 'rename';
  const text = isRename ? renameOutput.value : listOutput.value;
  const ext = isRename ? (document.getElementById('scriptTypeBtn')?.dataset.type === 'bash' ? 'sh' : 'ps1') : 'txt';
  const fname = isRename ? `rename_pdfs.${ext}` : 'pdf_ocr_list.txt';
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = fname;
  a.click();
  showToast(`${fname} をダウンロードしました`, 'success');
});

// ===== Apply rename (download with new name) =====
applyRenameBtn.addEventListener('click', async () => {
  const toRename = state.files.filter(f => f.status === 'done' && (f.author || f.title));
  if (!toRename.length) { showToast('リネーム対象がありません（OCRを先に実行してください）', 'error'); return; }
  showToast(`${toRename.length} 件をダウンロードします…`, 'success');
  for (const item of toRename) {
    const newName = buildNewName(item);
    const arrayBuf = await item.file.arrayBuffer();
    const blob = new Blob([arrayBuf], { type: 'application/pdf' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = newName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
    item.renamed = true;
    updateCard(item);
    await new Promise(r => setTimeout(r, 200));
  }
  showToast('全件ダウンロード完了！', 'success');
});

// ===== Single rename (download) =====
window.singleRename = async (id) => {
  const item = state.files.find(f => f.id == id);
  if (!item) return;
  const newName = buildNewName(item);
  const arrayBuf = await item.file.arrayBuffer();
  const blob = new Blob([arrayBuf], { type: 'application/pdf' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = newName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
  item.renamed = true;
  updateCard(item);
  showToast(`${newName} をダウンロードしました`, 'success');
};

// ===== Steps =====
function updateSteps(active) {
  [1,2,3].forEach(n => {
    const el = document.getElementById('step'+n);
    el.className = 'step' + (n < active ? ' done' : n === active ? ' active' : '');
  });
}

// ===== Helpers =====
function escHtml(str) {
  return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function updateFileCount() {
  fileCount.textContent = `${state.files.length} 件のPDF`;
}
function showToast(msg, type = 'success') {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.innerHTML = type === 'success'
    ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-success)" stroke-width="2.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>'
    : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-error)" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>';
  t.innerHTML += '<span>' + escHtml(msg) + '</span>';
  c.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity 0.4s'; setTimeout(() => t.remove(), 400); }, 4000);
}
</script>
